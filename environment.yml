name: chaos-agents
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - anthropic>=0.40.0
  - httpx>=0.27.0
  - python-sounddevice>=0.4.6
  - numpy>=1.24.0
  - langchain-anthropic
  - langgraph
  - langchain-core
  - pydantic
  - ipykernel
  - setuptools
  - pip
  - pip:
      - webrtcvad>=2.0.10       # no conda-forge build
      - faster-whisper>=1.0.0   # no conda-forge build
      - obs-websocket-py==1.0 # OBS WebSocket integration
      - webrtcvad-wheels
      - grandalf                # for LangGraph's draw_ascii() visualization
